services:
  # Service 1: Backend API
  - type: node
    name: mint-training-backend
    rootDirectory: backend
    buildCommand: npm install
    startCommand: npm start
    env: node
    envVars:
      - key: PORT
        value: "5000"
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: http://localhost:3000,https://mint-frontend.onrender.app
      - key: DATABASE_HOST
        fromSecret: DATABASE_HOST
      - key: DATABASE_PORT
        value: "5432"
      - key: DATABASE_DATABASE
        fromSecret: DATABASE_NAME
      - key: DATABASE_USER
        fromSecret: DATABASE_USER
      - key: DATABASE_PASSWORD
        fromSecret: DATABASE_PASSWORD
      - key: JWT_SECRET
        fromSecret: JWT_SECRET
      - key: CORS_ORIGIN
        fromSecret: CORS_ORIGIN
      - key: API_URL
        fromValue: https://mint-training-backend.onrender.com
    # Renders as a web service with a public URL
    # Example: https://mint-training-backend.onrender.com

  # Service 2: Frontend React app
  - type: node
    name: mint-training-frontend
    rootDirectory: frontend
    buildCommand: npm run build
    startCommand: npx serve -s build -l 5000
    env: node
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          - name: mint-training-backend
            property: proxy
      - key: NODE_ENV
        value: production